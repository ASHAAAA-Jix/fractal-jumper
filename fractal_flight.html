<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fractal Flight</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(10, 15, 35, 0.88);
      --text: #eaf0ff;
      --muted: #aeb8d8;
      --accent: #7aa2ff;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    #gl {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }

    #hud {
      position: fixed;
      inset: 14px auto auto 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
    }

    #setup {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #15234d 0%, #050812 52%, #000 100%);
      z-index: 20;
    }

    .panel {
      width: min(540px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
      padding: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      color: #d7e0ff;
    }

    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #fff;
      padding: 8px;
      box-sizing: border-box;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: var(--accent);
      color: #0b1020;
      font-weight: 650;
      cursor: pointer;
    }

    .ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #eef2ff;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="hud" hidden>
    <strong>Fractal Flight</strong><br />
    Click scene for mouse-look. ESC to release.<br />
    <span id="stats"></span>
  </div>

  <div id="setup">
    <form id="setupForm" class="panel">
      <h1>Fractal Flight Setup</h1>
      <p>Set your initial render + motion values, then launch. You fly straight while looking around.</p>
      <div class="grid">
        <label>Speed (units/s)
          <input name="speed" type="number" value="0.5" step="0.05" min="0.01" max="4.0" />
        </label>
        <label>FOV (degrees)
          <input name="fov" type="number" value="78" step="1" min="40" max="120" />
        </label>
        <label>Mandelbulb power
          <input name="power" type="number" value="8" step="0.1" min="2" max="16" />
        </label>
        <label>Iterations
          <input name="iterations" type="number" value="12" step="1" min="4" max="24" />
        </label>
        <label>Bailout radius
          <input name="bailout" type="number" value="3.6" step="0.1" min="2" max="8" />
        </label>
        <label>Fractal scale
          <input name="scale" type="number" value="1.0" step="0.05" min="0.3" max="3" />
        </label>
        <label>Surface detail (epsilon)
          <input name="epsilon" type="number" value="0.0015" step="0.0001" min="0.0005" max="0.01" />
        </label>
        <label>Color shift
          <input name="colorShift" type="number" value="0.22" step="0.01" min="0" max="2" />
        </label>
      </div>
      <div class="actions">
        <button type="submit">Launch Flight</button>
        <button type="button" id="presetBtn" class="ghost">Use dramatic preset</button>
      </div>
    </form>
  </div>

  <script>
    const canvas = document.getElementById('gl');
    const hud = document.getElementById('hud');
    const statsEl = document.getElementById('stats');
    const setup = document.getElementById('setup');
    const form = document.getElementById('setupForm');
    const presetBtn = document.getElementById('presetBtn');

    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) {
      alert('WebGL2 is required for this demo.');
      throw new Error('WebGL2 not available');
    }

    const vertexSrc = `#version 300 es
      precision highp float;
      layout (location = 0) in vec2 aPos;
      out vec2 vUv;
      void main() {
        vUv = aPos * 0.5 + 0.5;
        gl_Position = vec4(aPos, 0.0, 1.0);
      }
    `;

    const fragmentSrc = `#version 300 es
      precision highp float;
      out vec4 outColor;
      in vec2 vUv;

      uniform vec2 uResolution;
      uniform float uTime;
      uniform float uFov;
      uniform vec3 uCamPos;
      uniform mat3 uCamBasis;

      uniform float uPower;
      uniform int uIterations;
      uniform float uBailout;
      uniform float uScale;
      uniform float uEpsilon;
      uniform float uColorShift;

      const int MAX_MARCH = 128;
      const float FAR_CLIP = 100.0;

      float mandelbulbDE(vec3 p) {
        vec3 z = p / uScale;
        float dr = 1.0;
        float r = 0.0;

        for (int i = 0; i < 30; i++) {
          if (i >= uIterations) break;
          r = length(z);
          if (r > uBailout) break;

          float theta = acos(clamp(z.z / max(r, 1e-6), -1.0, 1.0));
          float phi = atan(z.y, z.x);
          float zr = pow(r, uPower);

          dr = pow(r, uPower - 1.0) * uPower * dr + 1.0;

          theta *= uPower;
          phi *= uPower;

          z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta));
          z += p / uScale;
        }

        return 0.5 * log(r + 1e-6) * r / dr * uScale;
      }

      vec3 estimateNormal(vec3 p) {
        vec2 e = vec2(uEpsilon, 0.0);
        return normalize(vec3(
          mandelbulbDE(p + e.xyy) - mandelbulbDE(p - e.xyy),
          mandelbulbDE(p + e.yxy) - mandelbulbDE(p - e.yxy),
          mandelbulbDE(p + e.yyx) - mandelbulbDE(p - e.yyx)
        ));
      }

      vec3 palette(float t) {
        vec3 a = vec3(0.36, 0.42, 0.56);
        vec3 b = vec3(0.52, 0.42, 0.36);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.1 + uColorShift, 0.17, 0.29);
        return a + b * cos(6.28318 * (c * t + d));
      }

      void main() {
        vec2 uv = (vUv * 2.0 - 1.0);
        uv.x *= uResolution.x / uResolution.y;

        float fovScale = tan(radians(uFov) * 0.5);
        vec3 rayDir = normalize(uCamBasis * vec3(uv * fovScale, 1.0));

        float t = 0.0;
        float d = 0.0;
        bool hit = false;

        for (int i = 0; i < MAX_MARCH; i++) {
          vec3 p = uCamPos + rayDir * t;
          d = mandelbulbDE(p);
          if (d < uEpsilon * (0.6 + t * 0.02)) {
            hit = true;
            break;
          }
          t += d * 0.95;
          if (t > FAR_CLIP) break;
        }

        vec3 col = vec3(0.0);
        vec3 bg = mix(vec3(0.01, 0.02, 0.05), vec3(0.07, 0.08, 0.13), 0.5 + 0.5 * rayDir.y);

        if (hit) {
          vec3 p = uCamPos + rayDir * t;
          vec3 n = estimateNormal(p);
          vec3 lightDir = normalize(vec3(0.4, 0.8, -0.2));
          float diff = max(dot(n, lightDir), 0.0);
          float rim = pow(1.0 - max(dot(n, -rayDir), 0.0), 2.2);
          float ao = exp(-0.015 * t * t);
          float hue = fract(0.02 * t + 0.15 * n.y + 0.1 * sin(uTime * 0.25));
          vec3 base = palette(hue);

          col = base * (0.2 + 1.2 * diff) + rim * vec3(0.9, 0.8, 1.0);
          col *= ao;
          col += 0.06 * exp(-0.005 * t * t) * vec3(0.7, 0.9, 1.2);
        } else {
          col = bg;
        }

        col = mix(bg, col, exp(-0.0009 * t * t));
        col = pow(col, vec3(0.92));
        outColor = vec4(col, 1.0);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error('Shader compile failed: ' + info);
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSrc));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSrc));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error('Program link failed: ' + gl.getProgramInfoLog(program));
    }

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1,
    ]), gl.STATIC_DRAW);

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const u = {
      resolution: gl.getUniformLocation(program, 'uResolution'),
      time: gl.getUniformLocation(program, 'uTime'),
      fov: gl.getUniformLocation(program, 'uFov'),
      camPos: gl.getUniformLocation(program, 'uCamPos'),
      camBasis: gl.getUniformLocation(program, 'uCamBasis'),
      power: gl.getUniformLocation(program, 'uPower'),
      iterations: gl.getUniformLocation(program, 'uIterations'),
      bailout: gl.getUniformLocation(program, 'uBailout'),
      scale: gl.getUniformLocation(program, 'uScale'),
      epsilon: gl.getUniformLocation(program, 'uEpsilon'),
      colorShift: gl.getUniformLocation(program, 'uColorShift')
    };

    const state = {
      started: false,
      speed: 0.5,
      fov: 78,
      power: 8,
      iterations: 12,
      bailout: 3.6,
      scale: 1.0,
      epsilon: 0.0015,
      colorShift: 0.22,
      yaw: 0,
      pitch: 0,
      camPos: [0, 0, -6],
      lastTime: performance.now(),
      frameCount: 0,
      fpsTime: 0,
      fps: 0,
    };

    function applySettingsFromForm() {
      const data = new FormData(form);
      state.speed = Number(data.get('speed'));
      state.fov = Number(data.get('fov'));
      state.power = Number(data.get('power'));
      state.iterations = Math.floor(Number(data.get('iterations')));
      state.bailout = Number(data.get('bailout'));
      state.scale = Number(data.get('scale'));
      state.epsilon = Number(data.get('epsilon'));
      state.colorShift = Number(data.get('colorShift'));
    }

    function setPreset() {
      form.elements.speed.value = '0.75';
      form.elements.fov.value = '84';
      form.elements.power.value = '7.6';
      form.elements.iterations.value = '14';
      form.elements.bailout.value = '4.1';
      form.elements.scale.value = '0.92';
      form.elements.epsilon.value = '0.0012';
      form.elements.colorShift.value = '0.38';
    }

    presetBtn.addEventListener('click', setPreset);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      applySettingsFromForm();
      setup.hidden = true;
      hud.hidden = false;
      state.started = true;
      canvas.requestPointerLock?.();
      state.lastTime = performance.now();
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(innerWidth * dpr);
      const h = Math.floor(innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    addEventListener('resize', resize);
    resize();

    canvas.addEventListener('click', () => {
      if (!setup.hidden) return;
      canvas.requestPointerLock?.();
    });

    addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas || !state.started) return;
      const sensitivity = 0.0022;
      state.yaw -= e.movementX * sensitivity;
      state.pitch -= e.movementY * sensitivity;
      state.pitch = Math.max(-1.5, Math.min(1.5, state.pitch));
    });

    function cameraBasis(yaw, pitch) {
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const cy = Math.cos(yaw), sy = Math.sin(yaw);

      const forward = [sy * cp, sp, cy * cp];
      const right = [cy, 0, -sy];
      const up = [
        right[1] * forward[2] - right[2] * forward[1],
        right[2] * forward[0] - right[0] * forward[2],
        right[0] * forward[1] - right[1] * forward[0],
      ];

      return { forward, right, up };
    }

    function frame(now) {
      resize();
      const dt = Math.min((now - state.lastTime) / 1000, 0.1);
      state.lastTime = now;

      gl.useProgram(program);
      gl.bindVertexArray(vao);

      if (state.started) {
        const basis = cameraBasis(state.yaw, state.pitch);
        state.camPos[0] += basis.forward[0] * state.speed * dt;
        state.camPos[1] += basis.forward[1] * state.speed * dt;
        state.camPos[2] += basis.forward[2] * state.speed * dt;

        gl.uniform2f(u.resolution, canvas.width, canvas.height);
        gl.uniform1f(u.time, now * 0.001);
        gl.uniform1f(u.fov, state.fov);
        gl.uniform3f(u.camPos, state.camPos[0], state.camPos[1], state.camPos[2]);
        gl.uniformMatrix3fv(u.camBasis, false, new Float32Array([
          basis.right[0], basis.right[1], basis.right[2],
          basis.up[0],    basis.up[1],    basis.up[2],
          basis.forward[0], basis.forward[1], basis.forward[2],
        ]));

        gl.uniform1f(u.power, state.power);
        gl.uniform1i(u.iterations, state.iterations);
        gl.uniform1f(u.bailout, state.bailout);
        gl.uniform1f(u.scale, state.scale);
        gl.uniform1f(u.epsilon, state.epsilon);
        gl.uniform1f(u.colorShift, state.colorShift);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        state.frameCount++;
        state.fpsTime += dt;
        if (state.fpsTime >= 0.5) {
          state.fps = Math.round(state.frameCount / state.fpsTime);
          state.frameCount = 0;
          state.fpsTime = 0;
          statsEl.textContent = `Speed ${state.speed.toFixed(2)} | FOV ${state.fov.toFixed(0)}° | FPS ~${state.fps}`;
        }
      } else {
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
